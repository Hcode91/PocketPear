name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy runs pip with a host Python of the same version as the app's (3.13)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Tools
        run: sudo apt-get install -y ninja-build libboost-dev

      - name: Unicorn for Android (cached by version)
        uses: actions/cache@v4
        with:
          path: android/build-unicorn/unicorn
          key: unicorn-src-2.1.4

      - name: Build Unicorn
        run: android/build-unicorn.sh "$ANDROID_NDK_LATEST_HOME"

      - name: dynarmic source (cached by commit)
        uses: actions/cache@v4
        with:
          path: android/build-ppcpu/dynarmic
          key: dynarmic-src-a46601580d5512d324104f985b5f0209dc980ddc

      - name: Build the CPU core (dynarmic)
        run: android/build-ppcpu.sh "$ANDROID_NDK_LATEST_HOME"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PocketPear-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
